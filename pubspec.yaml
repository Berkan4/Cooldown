publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  home_widget: ^0.7.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
